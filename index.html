<style>
:root{--bg:#0b1220;--card:#131c2e;--card2:#182338;--line:#243149;--line2:#1b2740;--txt:#e8eefc;--muted:#93a3bd;--pri:#10b981;--pri-d:#0e9f6e;
--danger:#ef4444;--warn:#f59e0b;--nav:#0d1626;--input:#0e1728;--head:rgba(11,18,32,.92);--ov:rgba(3,7,15,.72);--onpri:#04140d;--shadow:0 6px 20px rgba(0,0,0,.25);
--p:var(--pri);--p2:var(--pri);--mu:var(--muted);--bd:var(--line);--tx:var(--txt);--ok:#10b981;--bad:#ef4444;
--okbg:rgba(16,185,129,.16);--okbd:rgba(16,185,129,.5);--okfg:#6ee7b7;--wbg:rgba(245,158,11,.16);--wbd:rgba(245,158,11,.5);--wfg:#fcd34d;--bbg:rgba(239,68,68,.16);--bbd:rgba(239,68,68,.5);--bfg:#fda4af;--ebg:rgba(99,102,241,.2);--efg:#c7d2fe}
:root[data-theme="light"]{--bg:#f2f5fa;--card:#fff;--card2:#eef2f8;--line:#d8e0ec;--line2:#e9eef7;--txt:#0f1a2b;--muted:#5b6a82;--pri:#0e9f6e;--pri-d:#0b8a5f;--nav:#fff;--input:#fff;--head:rgba(255,255,255,.95);--ov:rgba(15,23,42,.45);--onpri:#fff;--shadow:0 6px 20px rgba(15,23,42,.12);
--okbg:#d1fae5;--okbd:#6ee7b7;--okfg:#065f46;--wbg:#fef3c7;--wbd:#fcd34d;--wfg:#92400e;--bbg:#fee2e2;--bbd:#fca5a5;--bfg:#991b1b;--ebg:#e0e7ff;--efg:#3730a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,Arial,sans-serif;font-size:15px;line-height:1.5}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
a{color:var(--pri);cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}
.splash{padding:40vh 0 0;text-align:center;color:var(--muted)}
.login{max-width:400px;margin:0 auto;padding:max(36px,8vh) 20px;min-height:100vh}
.login form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.logo{width:68px;height:68px;border-radius:18px;display:block;margin:0 auto 12px;box-shadow:0 6px 20px rgba(16,185,129,.35)}
.login h1{text-align:center;margin:0 0 4px;font-size:25px}
.login p.sub{text-align:center;color:var(--muted);margin:0 0 18px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,select,textarea,button{font:inherit}
input,select{width:100%;padding:10px 12px;border-radius:10px;background:var(--input);color:var(--txt);border:1px solid var(--line);outline:none;min-height:44px}
input:focus,select:focus{border-color:var(--pri)}
input[type=date]{min-width:0;max-width:100%}
input[type=checkbox]{width:auto;min-height:0;accent-color:var(--pri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;min-height:44px;font-weight:700;cursor:pointer;background:var(--pri);color:var(--onpri)}
.btn:active{background:var(--pri-d)}
.btn:disabled{opacity:.55}
.btn.block{width:100%;margin-top:16px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:600}
.btn.bad{background:var(--bbg);color:var(--bfg);border:1px solid var(--bbd)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:9px}
.err{background:var(--bbg);border:1px solid var(--bbd);color:var(--bfg);padding:10px 12px;border-radius:10px;margin-top:14px;font-size:14px}
header.top{position:sticky;top:0;z-index:20;background:var(--head);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
header.top .who{flex:1;min-width:0}
header.top .who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .who span{font-size:12px;color:var(--pri);font-weight:700}
.ibtn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;min-width:38px;height:38px;cursor:pointer;font-size:16px}
.ibtn.txt{font-size:13px;font-weight:600;padding:0 12px}
nav.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bnav a{flex:1;text-align:center;padding:8px 2px 7px;color:var(--muted);font-size:11.5px;cursor:pointer;user-select:none}
nav.bnav a .ic{display:block;height:24px}nav.bnav a .ic svg{display:block;margin:0 auto}
nav.bnav a.on{color:var(--pri);font-weight:700}
main{max-width:980px;margin:0 auto;padding:14px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px;min-width:0}
.muted{color:var(--muted);font-size:13.5px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.scanbox{display:flex;gap:8px}
.scanbox input{font-size:18px;letter-spacing:.5px}
.scanbox .btn{flex:0 0 auto}
.feed{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{padding:11px 13px;border-radius:12px;border:1px solid;display:flex;justify-content:space-between;gap:8px;align-items:center;animation:pop .2s}
.item.ok{background:var(--okbg);border-color:var(--okbd);color:var(--okfg)}
.item.warn{background:var(--wbg);border-color:var(--wbd);color:var(--wfg)}
.item.bad{background:var(--bbg);border-color:var(--bbd);color:var(--bfg)}
.item small{opacity:.8}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.video{width:100%;max-height:300px;border-radius:14px;background:#000;object-fit:cover;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700}
.chip.present{background:var(--okbg);color:var(--okfg)}.chip.late{background:var(--wbg);color:var(--wfg)}.chip.absent{background:var(--bbg);color:var(--bfg)}.chip.excused{background:var(--ebg);color:var(--efg)}
.roster .r{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line2)}
.roster .r:last-child{border:0}
.roster .nm{flex:1;min-width:0}
.roster .nm small{color:var(--muted);display:block}
.mini{display:flex;gap:4px}
.mini button{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:8px;min-width:36px;height:36px;font-weight:700;cursor:pointer}
.mini button.on.present{background:var(--ok);color:#fff;border-color:var(--ok)}
.mini button.on.late{background:var(--warn);color:#fff;border-color:var(--warn)}
.mini button.on.absent{background:var(--bad);color:#fff;border-color:var(--bad)}
.mini button.on.excused{background:#6366f1;color:#fff;border-color:#6366f1}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line2);text-align:center;vertical-align:middle}
th:first-child,td:first-child{text-align:start}
th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{height:8px;background:var(--line2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.bar i.low{background:var(--bad)}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.kpi div{flex:1 1 90px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:21px;color:var(--txt);font-weight:800}
.toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--card2);color:var(--txt);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:80;max-width:90vw;box-shadow:var(--shadow);font-size:13.5px}
.toast[hidden]{display:none}
.days{display:flex;gap:6px 14px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:6px;margin:0;font-size:14px;color:var(--txt)}
.empty{text-align:center;color:var(--muted);padding:20px}
details{border-top:1px solid var(--line)!important}
summary{cursor:pointer}
.acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.qrbig{max-width:340px;margin:10px auto;background:#fff;padding:6px;border-radius:12px}
.qrbig svg,.qrwrap svg{width:100%;height:auto;display:block}
.idcard{max-width:420px;margin:0 auto 14px}
.idh{background:linear-gradient(140deg,#10b981,#0ea5e9);color:#fff;text-align:center;font-weight:800;padding:12px;border-radius:12px;font-size:18px}
.kv{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--line2)}
.kv span{color:var(--muted)}
.qrwrap{max-width:300px;margin:14px auto 6px;background:#fff;padding:8px;border-radius:12px}
.livebox{margin-top:12px}
.overlay{position:fixed;inset:0;z-index:100;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.overlay .ovqr{width:min(70vh,92vw);height:auto}
.overlay .ovqr svg{width:100%;height:auto;display:block}
.overlay div[style*="monospace"]{font-size:clamp(28px,6vh,56px)!important}
.ovcode{font:700 24px monospace;text-align:center;letter-spacing:3px;color:var(--txt)}
@media(max-width:520px){main{padding:12px}.kpi b{font-size:18px}}
@media print{header.top,nav.bnav,.noprint,.toast{display:none!important}body{background:#fff;color:#000;padding:0;font-size:12px}main{max-width:none;padding:0}.card{border:0;box-shadow:none;padding:0;background:#fff}th,td{color:#000;border-color:#ccc}}
</style>

function beep(ok){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?880:220;g.gain.value=.15;o.start();o.stop(a.currentTime+(ok?.12:.35));}catch(e){}if(navigator.vibrate)navigator.vibrate(ok?40:[80,60,80]);}
async function fetchAll(build){let out=[],from=0;for(;;){const {data,error}=await build().range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000;}return out;}
const chunk=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r;};


/* ---------- helpers: qr + camera ---------- */
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.append(s);});}
async function loadQR(){if(!window.qrcode)await loadScript('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js');}
function makeQR(text,cell){const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag(cell||6,8);}
async function loadXLSX(){if(!window.XLSX)await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');}
function getPos(){return new Promise(r=>{if(!navigator.geolocation)return r(null);navigator.geolocation.getCurrentPosition(p=>r(p.coords),()=>r(null),{enableHighAccuracy:true,timeout:10000,maximumAge:0});});}
async function startCam(box,onCode){
  const last={c:'',t:0};
  const fire=v=>{const n=Date.now();if(v===last.c&&n-last.t<3000)return;last.c=v;last.t=n;onCode(v);};
  if('BarcodeDetector' in window){
    const video=h('video',{class:'video',playsinline:true,muted:true,autoplay:true});
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject=stream;await video.play();box.replaceChildren(video);
    const det=new BarcodeDetector();
    const iv=setInterval(async()=>{try{const r=await det.detect(video);if(r[0])fire(r[0].rawValue);}catch(e){}},300);
    return {stop(){clearInterval(iv);stream.getTracks().forEach(t=>t.stop());box.replaceChildren();}};
  }
  if(!window.Html5Qrcode)await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
  const id='rd'+Math.floor(Math.random()*1e6);
  box.replaceChildren(h('div',{id,style:'margin-top:10px'}));
  const q=new Html5Qrcode(id);
  await q.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},fire);
  return {stop(){q.stop().catch(()=>{});box.replaceChildren();}};
}

  const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();

}

/* ---------- login ---------- */
function loginView(){
  let mode='in';
  const wrap=h('div',{class:'login'});
  const draw=()=>{
    const err=h('div',{class:'err',hidden:true});
    const em=h('input',{type:'email',autocomplete:'username',dir:'ltr',required:true});
    const pw=h('input',{type:'password',autocomplete:mode==='in'?'current-password':'new-password',dir:'ltr',required:true,minlength:mode==='in'?null:6});
    const code=h('input',{dir:'ltr',autocomplete:'off',required:true});
    const btn=h('button',{class:'btn block',type:'submit'},mode==='in'?'Log in':mode==='up'?'Activate account':'Change password');
    const f=h('form',{onsubmit:async e=>{
      e.preventDefault();err.hidden=true;btn.disabled=true;
      if(mode==='rs'){
        const {data,error}=await sb.rpc('reset_password',{p_email:em.value.trim(),p_code:code.value.trim(),p_new:pw.value});
        btn.disabled=false;
        if(error||!data){err.textContent='The code is wrong or expired. Ask the admin for a new code.';err.hidden=false;return;}
        mode='in';draw();toast('Password changed, please log in');return;
      }
      if(mode==='in'){
        const {error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
        btn.disabled=false;
        if(error){err.textContent='Wrong email or password';err.hidden=false;return;}
      }else{
        const {data,error}=await sb.auth.signUp({email:em.value.trim(),password:pw.value,options:{data:{invite:code.value.trim()}}});
        btn.disabled=false;
        if(error||!data.session){err.textContent=error&&/already/i.test(error.message)?'This email is already activated, please log in':'Details do not match the records, or the account is already active. Contact the admin.';err.hidden=false;return;}
      }
      await loadProfile();render();
    }},h('label',{},'Email'),em,
      mode==='in'?null:[h('label',{},mode==='rs'?'Reset code from the admin':'Activation code (your student ID, or the code the admin gave you)'),code],
      h('label',{},mode==='in'?'Password':'Choose a new password (at least 6 characters)'),pw,err,btn);
    wrap.replaceChildren(h('img',{class:'logo',src:ICON,alt:''}),h('h1',{},'Attendance System'),
      h('p',{class:'sub'},mode==='in'?'Log in to continue':mode==='up'?'Activate a new account':'Reset password'),f,
      h('p',{style:'text-align:center;margin-top:18px'},h('a',{href:'#',style:'color:var(--p);font-weight:700',onclick:e=>{e.preventDefault();mode=mode==='in'?'up':'in';draw();}},mode==='in'?'First time? Activate your account':'I have an account, log in')),
      mode==='in'?h('p',{style:'text-align:center;margin-top:6px'},h('a',{href:'#',style:'color:var(--mu)',onclick:e=>{e.preventDefault();mode='rs';draw();}},'Forgot password?')):null);
  };
  draw();return wrap;
}

/* ---------- sessions helper ---------- */
async function ensureSession(courseId,date){
  let {data}=await sb.from('sessions').select('*').eq('course_id',courseId).eq('session_date',date).maybeSingle();
  if(data)return data;
  const c=S.courses.find(x=>x.id===courseId);
  const r=await sb.from('sessions').insert({course_id:courseId,session_date:date,is_off_day:!c.days.includes(dowOf(date))}).select().single();
  if(r.error)throw r.error;return r.data;
}

/* ---------- scan view ---------- */
function scanView(root){
  const courses=S.courses.filter(c=>c.active);
  if(!courses.length){root.append(h('div',{class:'card empty'},'No courses assigned to you.'));return;}
  let courseId=localStorage.getItem('course');
  if(!courses.find(c=>c.id===courseId))courseId=courses[0].id;
  let date=today(),cam=null,lastCode='',lastAt=0;
  const sel=h('select',{onchange:e=>{courseId=e.target.value;localStorage.setItem('course',courseId);feed.replaceChildren();loadRoster();}},
    courses.map(c=>h('option',{value:c.id},c.name+(c.code?` (${c.code})`:''))));
  sel.value=courseId;
  const dIn=h('input',{type:'date','.value':date,onchange:e=>{date=e.target.value||today();loadRoster();}});
  const info=h('div',{class:'muted'});
  const code=h('input',{class:'scan-input',dir:'ltr',placeholder:'Scan the card or type the code',autocomplete:'off',autocapitalize:'off',enterkeyhint:'done',
    onkeydown:e=>{if(e.key==='Enter'){e.preventDefault();submit(code.value);code.value='';}}});
  const feed=h('div',{class:'feed'});
  const camBox=h('div');
  const roster=h('div',{class:'roster'});
  const sum=h('b');

  async function submit(c){
    c=(c||'').trim();if(!c)return;
    const {data,error}=await sb.rpc('record_scan',{p_course:courseId,p_code:c,p_date:date});
    let cls='bad',msg='';
    if(error){msg='Connection error';}
    else if(data.ok){
      if(data.duplicate){cls='warn';msg=`${data.name} · already checked in`;}
      else if(data.off_day){cls='warn';msg=`${data.name} · unscheduled day, for review`;}
      else{cls='ok';msg=`${data.name} · checked in`;}
    }else if(data.error==='unknown_card')msg='Unknown card: '+c;
    else if(data.error==='not_enrolled')msg=`${data.name} · not enrolled in this course`;
    else msg='Not allowed';
    beep(cls==='ok');
    feed.prepend(h('div',{class:'item '+cls},h('span',{},msg),h('small',{},new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}))));
    while(feed.children.length>8)feed.lastChild.remove();
    loadRoster();
  }

  async function loadRoster(){
    const c=courses.find(x=>x.id===courseId);
    info.textContent=`Lecture days: ${c.days.map(d=>DAYN[d]).join(', ')}`+(c.days.includes(dowOf(date))?'':' · Selected date is not a scheduled day (logged for review)');
    const {data:enr}=await sb.from('enrollments').select('student_id,home_day').eq('course_id',courseId);
    const hdm=Object.fromEntries((enr||[]).map(e=>[e.student_id,e.home_day]));
    const ids=(enr||[]).map(e=>e.student_id);
    let pr=[];if(ids.length){const r=await sb.from('profiles').select('id,full_name,student_no').in('id',ids).order('full_name');pr=r.data||[];}
    const {data:ses}=await sb.from('sessions').select('id').eq('course_id',courseId).eq('session_date',date).maybeSingle();
    let att={};if(ses){const r=await sb.from('attendance').select('student_id,status,reviewed').eq('session_id',ses.id);(r.data||[]).forEach(a=>att[a.student_id]=a);}
    const here=Object.values(att).filter(a=>a.status==='present'||a.status==='late').length;
    sum.textContent=`Present ${here} of ${pr.length}`;
    roster.replaceChildren(...pr.map(p=>{
      const a=att[p.id];
      return h('div',{class:'r'},h('div',{class:'nm'},p.full_name,h('small',{},(p.student_no||'')+(hdm[p.id]!=null&&hdm[p.id]!==dowOf(date)?' · his day is '+DOW3[hdm[p.id]]+' (will wait for approval)':''))),
        h('div',{class:'mini'},Object.keys(ST).map(k=>h('button',{class:(a&&a.status===k?'on ':'')+k,title:ST[k],onclick:()=>mark(p.id,k)},ST[k][0]))));
    }));
    if(!pr.length)roster.append(h('div',{class:'empty'},'No students in this course'));
  }
  async function mark(sid,status){
    try{const s=await ensureSession(courseId,date);
      const r=await sb.from('attendance').upsert({session_id:s.id,student_id:sid,status,method:'manual',recorded_by:S.profile.id,reviewed:!s.is_off_day},{onConflict:'session_id,student_id'});
      if(r.error)throw r.error;loadRoster();}catch(e){toast('Could not save');}
  }

  async function toggleCam(){
    if(cam){cam.stop();cam=null;camBox.replaceChildren();return;}
    try{cam=await startCam(camBox,submit);}catch(e){camBox.replaceChildren(h('div',{class:'err'},'Could not start the camera. Make sure camera access is allowed for this site.'));cam=null;}
  }
  async function toggleCamOld(){

  const liveBox=h('div');

    L.targets.push({qr:L.mini,code:L.minicode});

      L.static?null:[L.mini,L.minicode],
      h('div',{style:'text-align:center;font-size:18px;margin:8px 0'},'Present: ',L.cnt,' · Time left: ',L.left),
      h('div',{class:'row'},
        L.static?null:h('button',{class:'btn',onclick:()=>startShow('full')},'Full screen'),
        L.static?null:h('button',{class:'btn sec',onclick:()=>startShow('pip')},'Floating window'),
        h('button',{class:'btn bad',onclick:endSession},'End session'))));
  }
  async function getLoc(){toast('Getting your location…');return await getPos();}
  async function startShow(mode){
    // build display targets first (needs the click gesture), then open the session
    const prev=live;let targets=[];
    const mk=(doc,win)=>{const qr=doc.createElement('div'),code=doc.createElement('div'),left=doc.createElement('div');
      qr.style.cssText='width:100%;background:#fff;padding:8px;box-sizing:border-box';code.style.cssText='font:700 34px monospace;text-align:center;direction:ltr;letter-spacing:3px;margin:6px 0';left.style.cssText='text-align:center;color:#555;font:16px sans-serif';

      t.el=el;t.qr.className='ovqr';t.qr.style.width='min(70vh,92vw)';document.body.append(el);try{await document.documentElement.requestFullscreen();}catch(e){}targets.push(t);

      live={sid:data.session,tok:data.token,targets:[],until:0};

/* ---------- reports ---------- */
const DOW3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const wkKey=d=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+1)%7));return t.toISOString().slice(0,10);};
const dowU=d=>new Date(d+'T00:00:00Z').getUTCDay();
const fmtLong=d=>{const [y,m,dd]=d.split('-');return `${DOW3[dowU(d)]} ${dd}/${m}`;};
/* A lecture = one calendar week of a course. Sunday + Wednesday sessions of the same week are the same lecture.
   A student is "present" for a lecture if he has an APPROVED present/late record in any session of that week. */
function lectureStats(sessions,enr,att){
  const sById=Object.fromEntries(sessions.map(s=>[s.id,s]));
  const reg=sessions.filter(s=>!s.is_off_day);
  const weeks=[...new Set(reg.map(s=>wkKey(s.session_date)))].sort();
  const first={},onDay={};
  reg.forEach(s=>{const k=wkKey(s.session_date);if(!first[k]||s.session_date<first[k])first[k]=s.session_date;(onDay[dowU(s.session_date)]??=new Set()).add(k);});
  const am={};
  att.forEach(a=>{const s=sById[a.session_id];if(!s)return;const k=wkKey(s.session_date);const c=((am[a.student_id]??={})[k]??={ok:false,exc:false,pend:false});
    const pres=a.status==='present'||a.status==='late';
    if(!a.reviewed){if(pres)c.pend=true;return;}
    if(pres)c.ok=true;else if(a.status==='excused')c.exc=true;});
  const rows=enr.map(e=>{
    const held=weeks.filter(k=>e.home_day==null||(onDay[e.home_day]&&onDay[e.home_day].has(k)));
    const cells={};let pre=0,exc=0,pend=0;
    held.forEach(k=>{const c=(am[e.student_id]||{})[k]||{};
      if(c.ok){cells[k]='P';pre++;}else if(c.exc){cells[k]='E';exc++;}else if(c.pend){cells[k]='?';pend++;}else cells[k]='A';});
    const abs=held.length-pre-exc;
    return {sid:e.student_id,home_day:e.home_day,held,cells,pre,exc,pend,abs,pct:held.length?Math.round(pre*100/held.length):0};
  });
  return {weeks,first,rows};
}
async function buildReport(courseId,from,to){
  const sessions=await fetchAll(()=>sb.from('sessions').select('id,session_date,is_off_day').eq('course_id',courseId).gte('session_date',from).lte('session_date',to).order('session_date'));
  const {data:enr}=await sb.from('enrollments').select('student_id,home_day').eq('course_id',courseId);
  const ids=(enr||[]).map(e=>e.student_id);
  let pr=[];for(const part of chunk(ids,150)){const r=await sb.from('profiles').select('id,full_name,student_no,section,grp').in('id',part);pr=pr.concat(r.data||[]);}
  pr.sort((a,b)=>String(a.full_name).localeCompare(String(b.full_name)));
  let att=[];
  for(const part of chunk(sessions.map(s=>s.id),80))att=att.concat(await fetchAll(()=>sb.from('attendance').select('session_id,student_id,status,reviewed').in('session_id',part)));
  const st=lectureStats(sessions,enr||[],att);
  const byId=Object.fromEntries(st.rows.map(r=>[r.sid,r]));
  const rows=pr.map(p=>({p,...byId[p.id]}));
  return {weeks:st.weeks,first:st.first,rows};
}

function checkinView(root){
  let cam=null;
  const box=h('div'),res=h('div');
  async function submitRpc(fn,args){
    const pos=await getPos();
    args.p_lat=pos?pos.latitude:null;args.p_lon=pos?pos.longitude:null;args.p_acc=pos?pos.accuracy:null;
    const {data,error}=await sb.rpc(fn,args);
    let cls='bad',msg='Connection problem';
    if(!error&&data){
      if(data.ok){cls=data.duplicate?'warn':'ok';msg=data.duplicate?`You are already checked in to ${data.course}`:`You are checked in to ${data.course}`+((data.off_day||data.flagged)?' (the teacher will review it)':'');if(data.flagged)cls='warn';}
      else msg=({closed:'Session is closed',window_closed:'Registration window is closed, ask the teacher to open it',bad_token:'Wrong or expired code, use the code shown now',not_enrolled:'You are not enrolled in this course',not_student:'Students only'})[data.error]||'Could not check in';
    }
    beep(cls==='ok');
    res.replaceChildren(h('div',{class:'item '+cls},h('span',{},msg)));
    if(cls!=='bad'&&cam){cam.stop();cam=null;}
  }
  function onCode(v){
    v=(v||'').trim();let m;
    if(m=/^ATT\|([0-9a-f-]{36})\|(\d+)$/.exec(v))return submitRpc('student_checkin',{p_session:m[1],p_token:m[2]});
    if(m=/^ATTC\|([0-9a-f-]{36})\|([0-9a-f]+)$/.exec(v))return submitRpc('student_checkin_static',{p_course:m[1],p_key:m[2]});
    res.replaceChildren(h('div',{class:'item bad'},'This is not an attendance code'));
  }
  const typed=h('input',{inputmode:'numeric',dir:'ltr',placeholder:'Type the code (8 digits)',maxlength:12,style:'font-size:20px;letter-spacing:2px;text-align:center'});
  const typedBtn=h('button',{class:'btn block',onclick:()=>{const v=typed.value.replace(/\D/g,'');if(v.length!==8){toast('The code is 8 digits');return;}submitRpc('student_checkin_code',{p_token:v});}},'Check in with code');
  root.append(h('div',{class:'card'},h('h2',{},'Check in'),
    h('p',{class:'muted'},'Tap Open camera and point it at the code on the teacher screen.'),
    h('button',{class:'btn block',style:'margin-top:0',onclick:async()=>{
      if(cam){cam.stop();cam=null;return;}
      res.replaceChildren();
      try{cam=await startCam(box,onCode);}catch(e){box.replaceChildren(h('div',{class:'err'},'Could not start the camera. Allow this site to use the camera.'));}
    }},'📷 Open camera'),box,
    h('hr',{style:'border:0;border-top:1px solid var(--bd);margin:16px 0'}),h('p',{class:'muted'},'If the camera does not work, type the code shown under the QR'),typed,typedBtn,res));
  const obs=new MutationObserver(()=>{if(!document.body.contains(root)){if(cam)cam.stop();obs.disconnect();}});
  obs.observe(document.body,{childList:true,subtree:true});
}

const HDR={student_no:['id','student id','student_id','student_no','studentno','رقم','الرقم','كود','ايدي','الايدي','الأيدي','الرقم الجامعي','رقم الطالب','رقم الجلوس','id number'],
  full_name:['name','full name','full_name','student name','الاسم','اسم','اسم الطالب','الاسم بالكامل'],
  email:['email','e-mail','mail','الايميل','الإيميل','ايميل','البريد','البريد الالكتروني','البريد الإلكتروني'],
  section:['section','سيكشن','سكشن','السيكشن','السكشن','الشعبة','شعبة'],
  grp:['group','grp','جروب','الجروب','مجموعة','المجموعة'],
  course:['course','courses','course code','المادة','المواد','كورس','الكورس','الكورسات','كود المادة']};
function mapRows(rows){
  if(!rows.length)return [];
  const norm=s=>String(s??'').trim().toLowerCase();
  const first=rows[0].map(norm);const idx={};
  for(const [k,names] of Object.entries(HDR)){const i=first.findIndex(x=>names.includes(x));if(i>=0)idx[k]=i;}
  let body=rows.slice(1);
  if(idx.student_no==null||idx.full_name==null){ // no header: id,name,email,section,group,course
    ['student_no','full_name','email','section','grp','course'].forEach((k,i)=>idx[k]=i);body=rows;}
  const g=(r,k)=>idx[k]==null?'':String(r[idx[k]]??'').trim();
  return body.map(r=>({student_no:g(r,'student_no'),full_name:g(r,'full_name'),email:g(r,'email').toLowerCase(),section:g(r,'section'),grp:g(r,'grp'),course:g(r,'course')})).filter(x=>x.student_no&&x.full_name);
}
